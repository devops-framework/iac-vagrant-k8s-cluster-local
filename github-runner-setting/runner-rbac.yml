# Tạo 2 namespace nếu chưa có
apiVersion: v1
kind: Namespace
metadata:
  name: frontend-stg
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend-stg
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
---
# ServiceAccount nằm tại namespace nơi Runner Pod được sinh ra (ví dụ: arc-runners)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-runner-sa
  namespace: arc-runners
---
# Quyền hạn tại namespace frontend
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-deploy-role
  namespace: frontend-stg
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "deployments", "services", "jobs", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-deploy-binding
  namespace: frontend-stg
subjects:
  - kind: ServiceAccount
    name: staging-runner-sa
    namespace: arc-runners
roleRef:
  kind: Role
  name: runner-deploy-role
  apiGroup: rbac.authorization.k8s.io
---
# Quyền hạn tại namespace backend (tương tự)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-deploy-role
  namespace: backend-stg
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "deployments", "services", "jobs", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-deploy-binding
  namespace: backend-stg
subjects:
  - kind: ServiceAccount
    name: staging-runner-sa
    namespace: arc-runners
roleRef:
  kind: Role
  name: runner-deploy-role
  apiGroup: rbac.authorization.k8s.io