# .coderabbit.yaml
language: "assertive" # Đặt ngôn ngữ phản hồi là tiếng Việt
reviews:
  profile: "chill" # Phong cách review nhẹ nhàng, hoặc "assertive" nếu muốn khắt khe hơn
  auto_review: false # TẮT tự động review khi mở PR

chat:
  auto_reply: true # Cho phép bạn chat qua lại với bot dưới comment để giải trình về code
