name: Reusable Build and Push
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        description: App name impacts to docker image tag
        type: string
      dockerfile_path:
        required: true
        description: Dockerfile path
        type: string
      deps_cache_key:
        required: false
        description: Cache key for restoring Maven dependencies cache from deps job (optional)
        type: string
      gha_environment:
        required: true
        description: Environment to get Github secrets and variables
        type: string
      
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      IAC_APP_ID:
        required: true
      IAC_APP_PRIVATE_KEY:
        required: true

jobs:
  build:
    name: 🚀 Build Docker & Push
    runs-on: stg-ci-runner-set
    environment: ${{ inputs.gha_environment }}
    permissions:
      contents: read
    steps:
      - name: Discord start notification
        uses: devops-framework/iac-vagrant-k8s-cluster-local/.github/actions/discord-notifier@91f07e08a7590ec439ab9820691bda27d858bcf4 # dev
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'start'
          title: '🚀 Start build ${{ inputs.app_name }}'
          message: |
            **Environment**: ${{ inputs.gha_environment }}
            **Action:** On-push

            **App Name:** ${{ inputs.app_name }}
            **Actor:** ${{ github.actor }}
            **Branch:** `${{ github.ref_name }}`

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.IAC_APP_ID }}
          private-key: ${{ secrets.IAC_APP_PRIVATE_KEY }}
          owner: devops-framework
          repositories: iac-vagrant-k8s-cluster-local

      - name: Checkout iac repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: devops-framework/iac-vagrant-k8s-cluster-local
          ref: 91f07e08a7590ec439ab9820691bda27d858bcf4 # dev
          token: ${{ steps.generate-token.outputs.token }}
          path: iac-repo

      - name: Restore Maven repository cache
        if: ${{ inputs.deps_cache_key != '' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./.m2/repository
          key: ${{ inputs.deps_cache_key }}

      - name: Ensure m2 local exists
        if: ${{ inputs.deps_cache_key != '' }}
        run: |
          ls ./.m2/repository

      - name: Set short SHA
        id: get-short-sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: get-image-tag
        run: echo "image_tag=gha-staging-${{ steps.get-short-sha.outputs.short_sha }}" >> "$GITHUB_OUTPUT"

      - name: Run Docker Build & Push
        id: docker-build-push
        uses: devops-framework/iac-vagrant-k8s-cluster-local/.github/actions/dockerhub-build-push@91f07e08a7590ec439ab9820691bda27d858bcf4 # dev
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          image_name: ${{ inputs.app_name }}
          image_tag: ${{ steps.get-image-tag.outputs.image_tag }}
          dockerfile_path: ${{ inputs.dockerfile_path }}

      - name: Update Image Tag in Deployment
        id: updated_image_tag
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          IMAGE_TAG="${{ steps.get-image-tag.outputs.image_tag }}"
          # Docker image names and GitOps overlay directory names are deliberately
          # distinct. Keep the mapping explicit and fail closed for a new app.
          case "$APP_NAME" in
            e-commerce-jsf) OVERLAY_NAME="storefront" ;;
            e-commerce-order-service) OVERLAY_NAME="order-service" ;;
            e-commerce-product-service) OVERLAY_NAME="product-service" ;;
            *)
              echo "ERROR: no staging overlay is registered for image $APP_NAME" >&2
              exit 1
              ;;
          esac
          MANIFEST_PATH="iac-repo/devops/cd/k8s/overlays/staging/${OVERLAY_NAME}/kustomization.yml"

          # Sanity checks: manifest must exist and contain an 'images:' block
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "ERROR: manifest path $MANIFEST_PATH does not exist" >&2
            exit 1
          fi

          if ! grep -q "^images:" "$MANIFEST_PATH"; then
            echo "ERROR: manifest $MANIFEST_PATH does not contain 'images:' block. Aborting." >&2
            exit 1
          fi

          # Fallback: use sed to replace newTag value in kustomization (simple, portable for Linux runners)
          sed -i "s|newTag: \".*\"|newTag: \"$IMAGE_TAG\"|g" "$MANIFEST_PATH"

          echo "manifest_path=${MANIFEST_PATH}" >> "$GITHUB_OUTPUT"

      - name: Commit and push iac changes
        id: iac-commit
        shell: bash
        run: |
          set -euo pipefail
          pushd iac-repo
          git config user.name "Tan Tran Thai Minh"
          git config user.email "tranthaiminhtansoft@gmail.com"
          TARGET_PATH="${{ steps.updated_image_tag.outputs.manifest_path }}"
          # Convert to relative path inside iac-repo if prefixed
          REL_PATH="${TARGET_PATH#iac-repo/}"
          echo "Adding path: $REL_PATH"
          git add "$REL_PATH"
          if git diff --staged --quiet; then
            echo "no changes to commit"
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(staging): Auto pin image to ${{ steps.get-short-sha.outputs.short_sha }}"
            COMMIT_HASH=$(git rev-parse HEAD)
            git push origin HEAD:dev
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          fi
          popd

      - name: Discord result notification
        if: always()
        uses: devops-framework/iac-vagrant-k8s-cluster-local/.github/actions/discord-notifier@91f07e08a7590ec439ab9820691bda27d858bcf4 # dev
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: '📂 Build results'
          message: |
            **Environment**: ${{ inputs.gha_environment }}
            **Status:** ${{ job.status }}
            **Action:** On-push
            
            **App Name:** ${{ inputs.app_name }}
            **Actor:** ${{ github.actor }}
            **Branch:** `${{ github.ref_name }}`
            **Image Tag:** [${{ steps.get-image-tag.outputs.image_tag || 'None' }}](${{ steps.docker-build-push.outputs.dockerhub_url || 'None' }})
            **Manifest Change:** ${{ steps.iac-commit.outputs.changes_detected == 'true' && format('[{1}](https://github.com/{0}/commit/{1})', github.repository, steps.iac-commit.outputs.commit_hash) || 'No changes' }}
