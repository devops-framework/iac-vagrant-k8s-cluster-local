name: AI PR Comment Triggered Reviewer
run-name: "🤖 AI Review [cmt-${{ github.event.comment.id }}]"

on:
  issue_comment:
    types: [created]

jobs:
  ai-pr-review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@tangpt')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository (check out PR head so runner uses PR branch)
        uses: actions/checkout@v4
        with:
          # checkout the PR branch that triggered the comment (issue_comment on a PR)
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Run AI PR review composite
        uses: ./.github/actions/ai-pr-review
        id: ai-pr-review
        env:
          # App secrets (pass via repository secrets)
          IAC_APP_ID: ${{ secrets.IAC_APP_ID }}
          IAC_APP_PRIVATE_KEY: ${{ secrets.IAC_APP_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Per-run values
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # Optional metadata forwarded to composite
          USER_COMMENT: ${{ github.event.comment.body }}
