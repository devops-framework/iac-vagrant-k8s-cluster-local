name: AI Review Cache Cleanup
run-name: 🧹 Cache Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-cache:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.IAC_APP_ID }}
          private-key: ${{ secrets.IAC_APP_PRIVATE_KEY }}

      - name: Delete PR Source Code Cache
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          CACHE_KEYS=$(gh api /repos/${{ github.repository }}/actions/caches \
            --jq ".actions_caches[] | select(.key | contains(\"source-context-${{ github.event.pull_request.number }}-\")) | .key")

          if [ -z "$CACHE_KEYS" ]; then
            echo "No cache files found for PR #${{ github.event.pull_request.number }}."
            echo "CACHE_KEYS_LIST=" >> $GITHUB_ENV
            echo "DELETED_COUNT=0" >> $GITHUB_ENV
          else
            echo "Cleaning cache for PR #${{ github.event.pull_request.number }}..."
            COUNT=0
            for KEY in $CACHE_KEYS; do
              gh api --method DELETE /repos/${{ github.repository }}/actions/caches?key=$KEY
              echo "=> Deleted: $KEY"
              COUNT=$((COUNT+1))
            done
            echo "CACHE_KEYS_LIST=$CACHE_KEYS" >> $GITHUB_ENV
            echo "DELETED_COUNT=$COUNT" >> $GITHUB_ENV
            echo "🧹 Cache cleanup completed."
          fi
