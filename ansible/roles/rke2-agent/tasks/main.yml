---
- name: Install RKE2 Agent binary
  shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE="agent" sh -
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  args:
    creates: /usr/local/bin/rke2

- name: Ensure RKE2 config directory exists
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

- name: Create RKE2 agent config
  copy:
    dest: /etc/rancher/rke2/config.yaml
    content: |
      server: https://{{ hostvars['rke2-server-001']['ansible_host'] }}:9345
      token: {{ rke2_token }}
    mode: '0600'

- name: Enable and start rke2-agent
  systemd:
    name: rke2-agent
    enabled: yes
    state: started
