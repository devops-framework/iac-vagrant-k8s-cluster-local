---
- name: Install Kubernetes module system dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-setuptools
    state: present
    update_cache: true

- name: Install Kubernetes module Python dependencies
  ansible.builtin.pip:
    name:
      - kubernetes
      - PyYAML

- name: Apply platform namespaces
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    src: "{{ role_path }}/files/namespaces.yml"
    state: present

- name: Apply staging network policies
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    src: "{{ role_path }}/files/network-policies.yml"
    state: present
