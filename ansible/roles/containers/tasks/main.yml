---
### /etc/hosts configuration ###

- name: Set /etc/hosts for all cluster nodes
  become: true
  lineinfile:
    path: /etc/hosts
    create: yes
    line: "{{ item.ip }} {{ item.hostname }}"
    state: present
  with_items: "{{ cluster_hosts }}"
  when: cluster_hosts is defined
  tags: etc_hosts

### Docker and Helm installation ###

- name: Install Docker
  apt:
    name:
      - docker.io
      - docker-compose
    state: present

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Install Helm
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    executable: /bin/bash

### Kubernetes prerequisites and configuration ###

- name: Disable swap immediately
  command: swapoff -a

- name: Comment out swap entries in /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^(.*\s+swap\s+.*)$'
    replace: '# \1'

- name: Load kernel module overlay
  modprobe:
    name: overlay
    state: present

- name: Load kernel module br_netfilter
  modprobe:
    name: br_netfilter
    state: present

- name: Ensure modules are loaded at boot (k8s.conf)
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

### Network settings for Kubernetes ###

- name: Set sysctl params for Kubernetes (kubernetes.conf)
  copy:
    dest: /etc/sysctl.d/kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: '0644'

- name: Reload sysctl with all configs
  command: sysctl --system

### Containerd installation and configuration ###

- name: Install prerequisites for containerd
  apt:
    name:
      - gnupg2
      - software-properties-common
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: yes

- name: Install containerd from Ubuntu repository
  apt:
    name: containerd
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

- name: Generate default containerd config
  command: containerd config default
  register: containerd_default
  changed_when: false

- name: Write config.toml
  copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout }}"
    mode: '0644'

- name: Enable systemd cgroup driver
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Enable & start containerd
  systemd:
    name: containerd
    enabled: yes
    state: started

### Kubernetes packages installation ###

- name: Install Kubernetes required packages
  apt:
    name:
      - conntrack
      - iptables
      - socat
      - ethtool
      - ebtables
      - arptables
      - ipset
    state: present
    update_cache: yes

- name: Download Kubernetes apt key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key
    dest: /tmp/k8s-release.key
    mode: '0644'

- name: Create keyring for kubernetes apt repository
  ansible.builtin.command: >
    gpg --dearmor --yes --output /usr/share/keyrings/kubernetes-archive-keyring.gpg /tmp/k8s-release.key
  args:
    creates: /usr/share/keyrings/kubernetes-archive-keyring.gpg

- name: Remove temporary kubernetes key file
  ansible.builtin.file:
    path: /tmp/k8s-release.key
    state: absent

- name: Add Kubernetes apt repository (signed-by keyring)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /"
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes

- name: Hold kube packages to prevent automatic upgrades
  ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
