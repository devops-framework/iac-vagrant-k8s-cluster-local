---
- name: Create ArgoCD Namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    name: argocd
    api_version: v1
    kind: Namespace
    state: present

- name: Install ArgoCD Manifests
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    namespace: argocd
    state: present

- name: Patch ArgoCD ConfigMap to disable internal TLS (Fix Redirect Loop)
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: argocd
      data:
        server.insecure: "true"

- name: Delete ArgoCD server pods to apply ConfigMap forcefully
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name=argocd-server
    state: absent

# --- SET MẬT KHẨU ADMIN MỚI ---

- name: Set Custom ArgoCD Admin Password
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
        namespace: argocd
      # Sử dụng stringData để Kubernetes tự động mã hóa base64
      # Filter password_hash('bcrypt') sẽ băm mật khẩu ra định dạng ArgoCD yêu cầu
      stringData:
        admin.password: "{{ 'admin' | password_hash('bcrypt') }}"
        admin.passwordMtime: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime }}"

# --- CẤU HÌNH INGRESS ---

- name: Create ArgoCD Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-server-ingress
        namespace: argocd
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
      spec:
        ingressClassName: nginx
        rules:
          - host: "{{ argocd_domain | default('argocd.homelab') }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80

- name: Display ArgoCD Access Info
  debug:
    msg: 
      - "ArgoCD URL: https://{{ argocd_domain | default('argocd.homelab') }}"
      - "Admin Password has been set to 'admin' password."

- name: Save Admin Password to Fact
  set_fact:
    argocd_url: "https://{{ hostvars['vip-lb']['ansible_host'] }}:{{ (argocd_svc.resources[0].spec.ports | selectattr('port', 'equalto', 443) | first).nodePort }}"
    argocd_admin_password: "{{ argocd_secret.resources[0].data.password | b64decode }}"

- name: Display ArgoCD Access Info
  debug:
    msg: 
      - "ArgoCD URL: {{ argocd_url }}"
      - "Admin Password: {{ argocd_admin_password }}"

# 1. Tạo AppProjects
- name: Ensure ArgoCD Projects exist
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: "{{ item.project_name }}"
        namespace: argocd
      spec:
        description: "{{ item.description }}"
        sourceRepos: "{{ item.source_repos }}"
        destinations: "{{ item.destinations }}"
  loop: "{{ argocd_projects }}"

# 2. Tạo Repository Secrets (Sử dụng HTTPS + PAT)
- name: Ensure ArgoCD Repositories are registered (HTTPS)
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}"
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        url: "{{ item.github_repo }}"
        username: "{{ github_username }}"
        password: "{{ github_pat }}"
        project: "{{ item.project }}"
  loop: "{{ argocd_repos }}"

# 3. Tạo Applications
- name: Ensure ArgoCD Applications are deployed
  kubernetes.core.k8s:
    kubeconfig: "{{ rke2_kubeconfig }}"
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: "{{ item.app_name }}"
        namespace: argocd
      spec:
        project: "{{ item.project_name }}"
        source:
          repoURL: "{{ item.repo_url }}"
          targetRevision: "{{ item.revision_branches if item.revision_branches != '' else item.revision_tags }}"
          path: "{{ item.path }}" # Bạn có thể tùy chỉnh path nếu cần
          directory: "{{ {'recurse': item.directory_recurse} if item.directory_recurse is defined and item.directory_recurse else omit }}"
        destination:
          server: "{{ item.destination_cluster }}"
          namespace: "{{ item.destination_namespace }}"
        syncPolicy: "{{ {'automated': {'prune': true, 'selfHeal': true}} if item.sync_policy != 'Manual' else omit }}"
  loop: "{{ argocd_apps }}"
