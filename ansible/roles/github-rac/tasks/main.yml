---
# Remove permissions created by releases before the runner switched to GitOps-only delivery.
- name: Remove legacy runner access from application namespaces
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
    state: absent
  loop:
    - kind: RoleBinding
      name: runner-deploy-binding
      namespace: frontend-stg
    - kind: Role
      name: runner-deploy-role
      namespace: frontend-stg
    - kind: RoleBinding
      name: runner-deploy-binding
      namespace: backend-stg
    - kind: Role
      name: runner-deploy-role
      namespace: backend-stg

# Runner jobs follow GitOps and do not receive direct access to application namespaces.
- name: Apply least-privilege ServiceAccount for GitHub runners
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    src: "{{ role_path }}/files/runner-service-account.yml"
    state: present

# Install ARC Controller.
- name: Install ARC Controller
  kubernetes.core.helm:
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    name: arc
    chart_ref: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    chart_version: "{{ arc_chart_version }}"
    release_namespace: arc-systems
    create_namespace: true
    state: present # Chỉ cài nếu chưa có hoặc có thay đổi cấu hình

# Deploy runner scale sets without writing the GitHub PAT to a temporary values file.
- name: Deploy runner charts for GitHub runners
  kubernetes.core.helm:
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    name: "{{ item.runner_name }}"
    chart_ref: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    chart_version: "{{ arc_chart_version }}"
    release_namespace: arc-runners
    create_namespace: true
    release_values:
      githubConfigUrl: "{{ item.github_repo }}"
      githubConfigSecret:
        github_token: "{{ arc_github_token }}"
      containerMode:
        type: dind
      template:
        spec:
          serviceAccountName: "{{ item.serviceAccountName }}"
          containers:
            - name: runner
              image: "{{ item.custom_image }}"
              command:
                - /home/runner/run.sh
              securityContext:
                readOnlyRootFilesystem: false
    state: present
  loop: "{{ github_runner_configs }}"
  no_log: true
